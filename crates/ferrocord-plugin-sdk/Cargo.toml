[package]
name = "ferrocord-plugin-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SDK and ABI types for Ferrocord WebAssembly plugins"
license = "MIT"
repository = "https://github.com/FerroApps/Ferrocord"
publish = false

[features]
default = ["guest"]
# Plugin-side helpers: the `Plugin` trait, `register_plugin!` and host call
# wrappers. The app depends on the crate without it, for the ABI types only.
guest = []

[dependencies]
serde = { version = "1", features = ["derive"] }
# MessagePack: the wire format of every hook and host call (self-describing,
# libraries exist for every language that targets wasm).
rmp-serde = "1"
# Byte fields (KV values, HTTP bodies) as MessagePack `bin`, not arrays.
serde_bytes = "0.11"
