name: CI

on:
  # Feature branches are covered by the pull_request trigger; pushing only
  # main/development avoids duplicate runs for every PR commit.
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libssl-dev libdbus-1-dev libxkbcommon-dev \
            libwayland-dev libfontconfig1-dev libasound2-dev dbus gnome-keyring \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/plugins -> target

      - name: cargo fmt --check
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/plugins/Cargo.toml --all -- --check

      - name: cargo clippy -- -D warnings
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p ferrocord-plugin-sdk --all-targets -- -D warnings
          cargo clippy --manifest-path examples/plugins/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      # The example plugins: unit tests natively, then the wasm modules the
      # plugin integration tests load (tests/plugins_examples.rs).
      - name: Example plugins
        run: |
          cargo test -p ferrocord-plugin-sdk
          cargo test --manifest-path examples/plugins/Cargo.toml
          examples/plugins/build.sh

      # The video helper's platform decoders: the system FFmpeg, opened with
      # dlopen at run time. Install the newest libavcodec the distribution has
      # so the tests exercise that path; a later step removes it again.
      - name: Install libavcodec (platform decoder tests)
        run: |
          pkg=$(apt-cache search --names-only '^libavcodec[0-9]+$' | awk '{print $1}' | sort -V | tail -1)
          echo "installing $pkg"
          sudo apt-get install -y --no-install-recommends "$pkg"

      - name: cargo test
        env:
          # The platform decoder tests fail instead of skipping.
          FERROCORD_EXPECT_PLATFORM: "1"
          # The example plugin tests fail instead of skipping.
          FERROCORD_EXPECT_PLUGINS: "1"
        run: cargo test --all-targets

      # The video helper must run on a machine with no codec packages: build it
      # the way the release does (libstdc++ static) and check what it links.
      - name: Video helper links nothing beyond the base system
        run: |
          export CXXSTDLIB=static=stdc++
          export RUSTFLAGS="-L native=$(dirname "$(g++ -print-file-name=libstdc++.a)")"
          cargo build --bin ferrocord-player --target-dir target/helper
          .github/scripts/check-helper-libs.sh target/helper/debug/ferrocord-player
          if ldd target/debug/ferrocord | grep -Eqi 'openh264|stdc\+\+|opus|vpx'; then echo "::error::ferrocord links a codec library"; exit 1; fi
          if ldd target/helper/debug/ferrocord-player target/debug/ferrocord | grep -Eqi 'avcodec|avutil|avformat|swscale'; then echo "::error::a binary links FFmpeg (it must be opened at run time)"; exit 1; fi

      # Without any FFmpeg the helper still starts, plays what its built-in
      # decoders handle and names the package for the rest.
      - name: Video helper without libavcodec
        run: |
          # Remove whichever packages own the library (libavcodec62,
          # libavcodec-extra62, ...), then make sure no copy is left.
          pkgs=$(dpkg -S 'libavcodec.so.*' 2>/dev/null | cut -d: -f1 | tr ',' '\n' | sort -u | xargs)
          echo "removing: $pkgs"
          sudo apt-get remove -y $pkgs
          sudo ldconfig
          if ldconfig -p | grep -q 'libavcodec\.so'; then ldconfig -p | grep libavcodec; echo "::error::libavcodec is still installed"; exit 1; fi
          target/helper/debug/ferrocord-player --backends | tee backends.txt
          grep -q '^platform none' backends.txt
          cargo test --test video_player

      # Only the login helper may link the browser engine (WebKitGTK).
      - name: Only ferrocord-login links WebKitGTK
        run: |
          if ldd target/debug/ferrocord | grep -Eqi 'webkit|javascriptcore|gtk-3|soup'; then echo "::error::ferrocord links WebKitGTK/GTK"; exit 1; fi
          ldd target/debug/ferrocord-login | grep -q 'libwebkit2gtk-4\.1' || { echo "::error::ferrocord-login does not link WebKitGTK 4.1"; exit 1; }

      # The StatusNotifierItem test needs a session bus; without one it
      # skips itself in the step above, so run it again under a private bus.
      - name: cargo test tray_sni (private session bus)
        run: dbus-run-session -- cargo test --test tray_sni

      # Real Secret Service: guards the zbus executor feature (tokio vs async-io)
      # that keyring's blocking connection depends on.
      - name: cargo test real_keyring (gnome-keyring on a private bus)
        env:
          FERRO_REAL_KEYRING: "1"
        run: |
          dbus-run-session -- sh -c 'echo | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --test real_keyring -- --ignored'

      # `--all-targets` skips doctests.
      - name: cargo test --doc
        run: cargo test --doc

  # The Linux job cannot see `cfg(windows)` breakage; build and test on Windows too.
  windows:
    name: windows build, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/plugins -> target
      - name: cargo build
        run: cargo build --all-targets
      - name: Example plugins
        shell: bash
        run: examples/plugins/build.sh
      - name: cargo test
        env:
          # Media Foundation's H.264 and AAC decoders must be found and work.
          FERROCORD_EXPECT_PLATFORM: "1"
          FERROCORD_EXPECT_PLUGINS: "1"
        run: cargo test --all-targets
      # mfplat.dll is loaded at run time: Windows N without the Media Feature
      # Pack must still start the helper.
      - name: ferrocord-player does not import Media Foundation
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\debug\ferrocord-player.exe | Out-String
          Write-Output $deps
          if ($deps -match '(?i)mfplat|mfreadwrite|mf\.dll') { Write-Error "ferrocord-player imports Media Foundation"; exit 1 }
          target\debug\ferrocord-player.exe --backends
