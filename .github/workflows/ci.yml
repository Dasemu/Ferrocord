name: CI

on:
  # Feature branches are covered by the pull_request trigger; pushing only
  # main/development avoids duplicate runs for every PR commit.
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libdbus-1-dev libxkbcommon-dev \
            libwayland-dev libfontconfig1-dev dbus

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      # The StatusNotifierItem test needs a session bus; without one it
      # skips itself in the step above, so run it again under a private bus.
      - name: cargo test tray_sni (private session bus)
        run: dbus-run-session -- cargo test --test tray_sni

      # `--all-targets` skips doctests.
      - name: cargo test --doc
        run: cargo test --doc
