name: Release

# Publishes a GitHub Release (Linux x86_64 tarball + Windows x86_64 zip, each
# with a .sha256) after every
# successful "Version" run on main. The bump commit that workflow pushes
# uses GITHUB_TOKEN, which never triggers `push` workflows, so this chains off
# `workflow_run` instead. Re-run manually from Actions -> Release -> Run
# workflow; it skips when release v<Cargo.toml version> already exists.
on:
  workflow_run:
    workflows: ["Version"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Oldest supported runner image: the binary links an older glibc and so runs on more distros.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read version and check for an existing release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install system libraries
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libssl-dev libdbus-1-dev libxkbcommon-dev \
            libwayland-dev libfontconfig1-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
      - name: Build release binary
        if: steps.ver.outputs.skip != 'true'
        run: |
          # OpenH264 (C++) is built from source; link libstdc++ statically so the
          # video helper needs no C++ runtime package on the user's machine.
          export CXXSTDLIB=static=stdc++
          export RUSTFLAGS="-L native=$(dirname "$(g++ -print-file-name=libstdc++.a)")"
          cargo build --release --locked
      - name: Shared libraries of the binary
        if: steps.ver.outputs.skip != 'true'
        run: |
          ldd target/release/ferrocord
          # No codec libraries anywhere; the helper needs only the base system.
          if ldd target/release/ferrocord | grep -Eqi 'openh264|stdc\+\+|opus|vpx'; then echo "::error::ferrocord links a codec library"; exit 1; fi
          .github/scripts/check-helper-libs.sh target/release/ferrocord-player
          # The browser engine is linked by the login helper only.
          if ldd target/release/ferrocord | grep -Eqi 'webkit|javascriptcore|gtk-3|soup'; then echo "::error::ferrocord links WebKitGTK/GTK"; exit 1; fi
          ldd target/release/ferrocord-login
      - name: Package
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          name="ferrocord-v${VERSION}-linux-x86_64"
          mkdir -p "dist/$name/packaging" "dist/$name/licenses"
          cp target/release/ferrocord target/release/ferrocord-player target/release/ferrocord-login README.md LICENSE "dist/$name/"
          cp packaging/dev.ferro.ferrocord.desktop "dist/$name/packaging/dev.ferro.ferrocord.desktop"
          cp packaging/dev.ferro.ferrocord.svg "dist/$name/packaging/dev.ferro.ferrocord.svg"
          cp assets/fonts/OFL.txt "dist/$name/licenses/Inter-OFL.txt"
          cp assets/icons/LICENSE "dist/$name/licenses/Lucide-ISC.txt"
          cp THIRD_PARTY.md "dist/$name/licenses/THIRD_PARTY.md"
          cp "$(find ~/.cargo/registry/src -path '*openh264-sys2-*/upstream/LICENSE' | head -n 1)" \
            "dist/$name/licenses/OpenH264-BSD-2-Clause.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
      - name: Create GitHub Release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          name="ferrocord-v${VERSION}-linux-x86_64"
          gh release create "v${VERSION}" --target "$SHA" \
            --title "Ferrocord v${VERSION}" --generate-notes \
            "dist/$name.tar.gz" "dist/$name.tar.gz.sha256"

  # Attaches the Windows x86_64 build to the release created above.
  windows:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $name = "ferrocord-v$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force "dist/$name/licenses" | Out-Null
          Copy-Item target/release/ferrocord.exe, target/release/ferrocord-login.exe, README.md, LICENSE "dist/$name/"
          Copy-Item assets/fonts/OFL.txt "dist/$name/licenses/Inter-OFL.txt"
          Copy-Item assets/icons/LICENSE "dist/$name/licenses/Lucide-ISC.txt"
          Copy-Item THIRD_PARTY.md "dist/$name/licenses/THIRD_PARTY.md"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # sha256sum format ("<hash>  <file>") so `sha256sum -c` also works.
          "$hash  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii
          Get-ChildItem dist
      - name: Upload to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $name = "ferrocord-v$env:VERSION-windows-x86_64"
          gh release upload "v$env:VERSION" "dist/$name.zip" "dist/$name.zip.sha256" --clobber
