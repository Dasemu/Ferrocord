# Build libopus from the source bundled in audiopus_sys and link it
# statically (the crate's "static" feature), so the binary does not need a
# libopus runtime package. Requires cmake at build time.
[env]
LIBOPUS_NO_PKG = "1"
# libopus 1.3's CMakeLists predates CMake 4, which refuses it without this.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
